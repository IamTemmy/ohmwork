name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ohmwork
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  browser-test:
    # Headless-browser smoke test (tests/test_webui_browser.py) for the
    # webui.py frontend -- one job, one Python version, Chromium only.
    # Kept separate from the matrix above: it needs `playwright install`,
    # which the plain unit/integration tests don't.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ohmwork (dev + browser extras)
        run: pip install -e ".[dev,browser]"

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(pip show playwright | awk '/^Version:/ {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium (downloads only on a cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Chromium's system dependencies (cache only covers the browser binary)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run headless-browser smoke test
        run: pytest tests/test_webui_browser.py tests/test_kmap_browser.py -q

      - name: Save schematic visual review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schematic-visual-review
          path: |
            test-artifacts/schematics/
            test-artifacts/kmaps/
          if-no-files-found: ignore

  spice-test:
    # Required Phase-1 gate: a missing system binary must fail, never skip.
    runs-on: ubuntu-latest
    env:
      OHMWORK_REQUIRE_NGSPICE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ngspice system binary
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          command -v ngspice
          ngspice --version
      - name: Install ohmwork
        run: pip install -e ".[dev]"
      - name: Verify export structure and every logical input vector
        run: pytest tests/test_spice.py tests/test_spice_ngspice.py -q
      - name: Save SPICE decks, simulator logs, and measured voltages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spice-electrical-review
          path: test-artifacts/spice/
          if-no-files-found: error

  five-variable-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: D20 exact-search time and memory gate
        run: python tools/benchmark_five_variables.py
      - uses: actions/upload-artifact@v4
        with:
          name: five-variable-performance
          path: test-artifacts/five-variable-performance.json
          if-no-files-found: error
