[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ohmwork"
version = "0.1.0"
description = "Digital logic derivation and synthesis, showing its work at every step."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Temiloluwa Adesola" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# Separate from `dev` on purpose: the headless-browser smoke test
# (tests/test_webui_browser.py) needs `playwright install chromium` run
# once after this, which the plain pytest matrix jobs shouldn't have to
# do. That test file skips itself cleanly (pytest.importorskip) when this
# extra isn't installed.
browser = ["playwright>=1.40"]

[project.scripts]
ohmwork = "ohmwork.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
